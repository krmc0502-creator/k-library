<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K.Library</title>

  <!-- iPhoneのホーム画面に追加したときの設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K.Library">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F3F1E8">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" href="images/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 森の入口のヘッダー -->
  <header class="forest">
    <img src="images/header.jpg" alt="木漏れ日の森の中にある、緑の扉の小さな図書館">
    <div class="greeting">
      <p class="hello" id="hello">ようこそ</p>
      <p class="season" id="season">今日はどんな本と出会えるかな？</p>
    </div>
  </header>

  <main>
    <section class="card welcome">
      <h1>K.Libraryへようこそ</h1>
      <p>本との出会いを、大切に残す場所です。<br>これから少しずつ、本の森を育てていきます。</p>
    </section>

    <section class="card soon">
      <h2>もうすぐ、ここに</h2>
      <ul>
        <li><span class="dot"></span>今日の出会い（毎朝4冊）</li>
        <li><span class="dot"></span>本のたねを迎える</li>
        <li><span class="dot"></span>思い出の本棚（本の森）</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
