<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K.Library</title>

  <!-- iPhoneのホーム画面に追加したときの設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K.Library">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F3F1E8">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" href="images/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 今日（ホーム）の画面 ===== -->
  <div class="view" id="view-home">
  <!-- 森の入口のヘッダー -->
  <header class="forest">
    <img src="images/header.jpg" alt="木漏れ日の森の中にある、緑の扉の小さな図書館">
    <div class="greeting">
      <p class="hello" id="hello">ようこそ</p>
      <p class="season" id="season">今日はどんな本と出会えるかな？</p>
    </div>
  </header>

  <!-- だれの本？（家族の切り替え） -->
  <section class="family" aria-label="だれの本">
    <span class="family-label">だれの本？</span>
    <button type="button" class="member" data-member="all">
      <span class="avatar avatar-all">みんな</span>
      <span class="member-name">家族</span>
    </button>
    <button type="button" class="member" data-member="mama">
      <img class="avatar" src="images/tanuki.png" alt="">
      <span class="member-name">ママ</span>
    </button>
    <button type="button" class="member" data-member="aoi">
      <img class="avatar" src="images/usagi.png" alt="">
      <span class="member-name">あおい</span>
    </button>
    <button type="button" class="member" data-member="yuto">
      <img class="avatar" src="images/risu.png" alt="">
      <span class="member-name">ゆうと</span>
    </button>
  </section>

  <main>
    <!-- 今日の出会い -->
    <section class="today" aria-labelledby="today-title">
      <div class="section-head">
        <h2 id="today-title">今日の出会い</h2>
        <span class="note">いまは見本の本です</span>
      </div>
      <div class="books" id="books"></div>
    </section>

    <!-- 本のたねを迎える -->
    <section class="card seed" aria-labelledby="seed-title">
      <div class="seed-head">
        <img src="images/sprout.png" alt="">
        <h2 id="seed-title">本のたねを迎える</h2>
      </div>
      <p class="hint">「面白そう」と思った瞬間を、ここに残しておきましょう。</p>
      <label for="seed-input">気になった本のタイトル</label>
      <form class="seed-row" id="seed-form">
        <input id="seed-input" type="text" placeholder="例：はてしない物語" autocomplete="off" enterkeyhint="done">
        <button type="submit" id="seed-button">迎える</button>
      </form>
      <p class="seed-for" id="seed-for"></p>
    </section>

    <!-- 本の数 -->
    <section class="counts" aria-label="本の数">
      <div class="count"><p>本のたね</p><p class="num"><span id="count-seed">0</span><small> 冊</small></p></div>
      <div class="count"><p>予約中</p><p class="num"><span id="count-reserved">0</span><small> 冊</small></p></div>
      <div class="count"><p>貸出中</p><p class="num"><span id="count-borrowed">0</span><small> 冊</small></p></div>
      <div class="count"><p>出会った本</p><p class="num"><span id="count-met">0</span><small> 冊</small></p></div>
    </section>

    <!-- 本の森への入口 -->
    <a class="to-forest" href="#mori" data-soon="本の森">
      <span>本の森へ</span>
      <img src="images/tree.png" alt="">
    </a>
  </main>
  </div>

  <!-- ===== 本のたねの画面 ===== -->
  <div class="view" id="view-tane" hidden>
    <header class="page-head">
      <img src="images/sprout.png" alt="">
      <h1>本のたね</h1>
    </header>
    <main>
      <p class="page-lead">いつか読んでみたい本たち。未来の出会いの芽を、ここで育てています。</p>
      <p class="page-who" id="tane-who"></p>
      <ul class="seed-list" id="seed-list"></ul>
      <div class="empty" id="seed-empty">
        <img src="images/sprout.png" alt="">
        <p>まだ本のたねはありません。<br>「今日」の画面から、気になった本を迎えてみましょう。</p>
      </div>
    </main>
  </div>

  <!-- 下のメニュー -->
  <nav class="tabs" aria-label="メインメニュー">
    <a href="#home" class="tab" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      今日
    </a>
    <a href="#tane" class="tab" data-view="tane">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/></svg>
      本のたね
    </a>
    <a href="#mori" class="tab" data-soon="本の森">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-6"/><path d="M12 2l6 9h-3l4 5H5l4-5H6z"/></svg>
      本の森
    </a>
    <a href="#sagasu" class="tab" data-soon="さがす">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      さがす
    </a>
  </nav>

  <!-- ちいさなお知らせ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
